name: ci

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test --test-timeout=180000 --test-force-exit
      - name: Validate manifests
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.agents/plugins/marketplace.json','utf8')); console.log('manifests ok')"

  browser:
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Detect a Chromium-family browser
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          path="$(node --input-type=module -e "import { findBrowser } from './src/env.mjs'; console.log(findBrowser({}) ?? '')")"
          if [ -n "$path" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Browser: $path"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Chromium-family browser found."
          fi
      - name: Browser tests
        if: steps.detect.outputs.available == 'true'
        shell: bash
        run: node --test --test-concurrency=1 --test-timeout=180000 --test-force-exit tests/integration/preview.test.mjs tests/integration/audit-baseline.test.mjs tests/integration/accessibility.test.mjs tests/integration/compare.test.mjs tests/integration/editor-cookie.test.mjs
      - name: No browser found
        if: steps.detect.outputs.available != 'true'
        shell: bash
        run: echo "No Chromium-family browser on this runner; browser tests skipped."
